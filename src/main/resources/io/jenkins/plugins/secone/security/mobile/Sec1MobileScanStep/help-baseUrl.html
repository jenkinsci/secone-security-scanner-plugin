<div>
    Sec1 Mobile Security API. Leave empty for Sec1 SaaS (<code>https://api.sec1.io/rest/ai-sast-mobile</code>). For on-premises scanner nodes use your load balancer, e.g. <code>https://scanner.example.com/ai-sast-mobile</code>. Can also be set with the <code>SEC1_MOBILE_BASE_URL</code> environment variable.
